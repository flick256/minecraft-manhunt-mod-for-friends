name: draft-release
# Builds the mod and attaches the jar to a DRAFT release (only visible to people with access to the repo).
# Runs when this file changes on the feature branch, or manually from the Actions tab.
# (Touch this file to publish a fresh draft with the latest build: v2 quiz subjects.)
on:
  push:
    branches: [claude/trusting-shannon-kaydpp]
    paths: ['.github/workflows/release-draft.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --console=plain
      - name: create draft release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/manhunt-*.jar | grep -v -- '-sources' | head -1)
          echo "Using $JAR"
          TAG="v1.0.0-mc26.2-${GITHUB_SHA::7}"
          gh release create "$TAG" "$JAR" --draft --target "$GITHUB_SHA" \
            --title "Manhunt 1.0.0 for Minecraft 26.2" \
            --notes "Put the jar in your mods folder with Fabric Loader 0.19.5+ and Fabric API 0.161.0+26.2 (Java 25). See the README for setup and commands."
